<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Animated ghost mascot waving goodbye next to a closed laptop">
  <title>Animated ghost mascot waving goodbye</title>

  <style>
    .float{animation:float 4.5s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    .led{animation:led 1.6s ease-in-out infinite}
    @keyframes led{0%,100%{opacity:.25}50%{opacity:1}}
    .tw{transform-box:fill-box;transform-origin:center;animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
    .pulse{animation:pulse 4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    .wave{animation:wave 1.6s ease-in-out infinite}
    @keyframes wave{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-20deg)}50%{transform:rotate(6deg)}75%{transform:rotate(-20deg)}}
    .shadow{transform-box:fill-box;transform-origin:center;animation:shadow 4.5s ease-in-out infinite}
    @keyframes shadow{0%,100%{transform:scale(1)}50%{transform:scale(.88)}}
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05050A"/>
      <stop offset="1" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset=".5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="gh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5EBFF"/>
      <stop offset=".55" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="g1">
      <stop offset="0" stop-color="#A855F7" stop-opacity=".45"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2">
      <stop offset="0" stop-color="#D946EF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#D946EF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#818CF8" stroke-opacity=".07"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  
  <rect width="900" height="240" rx="18" fill="url(#bg)"/>
  <rect width="900" height="240" rx="18" fill="url(#grid)"/>
  <ellipse cx="450" cy="120" rx="260" ry="130" fill="url(#g1)" class="pulse"/>
  <ellipse cx="130" cy="220" rx="240" ry="90" fill="url(#g2)"/>
  <ellipse cx="770" cy="220" rx="240" ry="90" fill="url(#g2)"/>


  <g transform="translate(250,60)"><path class="tw" style="animation-delay:0s" d="M0,-6 L1.6,-1.6 L6,0 L1.6,1.6 L0,6 L-1.6,1.6 L-6,0 L-1.6,-1.6 Z" fill="#C4B5FD"/></g>
  <g transform="translate(650,60)"><path class="tw" style="animation-delay:0s" d="M0,-6 L1.6,-1.6 L6,0 L1.6,1.6 L0,6 L-1.6,1.6 L-6,0 L-1.6,-1.6 Z" fill="#C4B5FD"/></g>
  <g transform="translate(170,150)"><path class="tw" style="animation-delay:1.1s" d="M0,-6 L1.6,-1.6 L6,0 L1.6,1.6 L0,6 L-1.6,1.6 L-6,0 L-1.6,-1.6 Z" fill="#F0ABFC"/></g>
  <g transform="translate(730,150)"><path class="tw" style="animation-delay:1.1s" d="M0,-6 L1.6,-1.6 L6,0 L1.6,1.6 L0,6 L-1.6,1.6 L-6,0 L-1.6,-1.6 Z" fill="#F0ABFC"/></g>
  <g transform="translate(330,34)"><path class="tw" style="animation-delay:2s" d="M0,-6 L1.6,-1.6 L6,0 L1.6,1.6 L0,6 L-1.6,1.6 L-6,0 L-1.6,-1.6 Z" fill="#818CF8"/></g>
  <g transform="translate(570,34)"><path class="tw" style="animation-delay:2s" d="M0,-6 L1.6,-1.6 L6,0 L1.6,1.6 L0,6 L-1.6,1.6 L-6,0 L-1.6,-1.6 Z" fill="#818CF8"/></g>


  <rect x="44" y="1" width="812" height="2" rx="1" fill="url(#edge)" class="pulse"/>
  <rect x="44" y="237" width="812" height="2" rx="1" fill="url(#edge)" class="pulse"/>

  <g transform="translate(450,100)">
    <ellipse class="shadow" cx="0" cy="92" rx="70" ry="7" fill="#A855F7" opacity=".35" filter="url(#blur)"/>

    <g class="float">
 
      <g transform="translate(-46,12)">
        <path d="M0,0 Q-14,8 -20,24" fill="none" stroke="#A9A0F0" stroke-width="11" stroke-linecap="round"/>
      </g>


      <path d="M-48,70 L-48,-8 C-48,-44 -28,-62 0,-62 C28,-62 48,-44 48,-8 L48,70 L32,58 L16,72 L0,58 L-16,72 L-32,58 Z" fill="url(#gh)" stroke="#E9D5FF" stroke-opacity=".7" stroke-width="1.5" stroke-linejoin="round"/>
      <ellipse cx="-22" cy="-40" rx="14" ry="7" fill="#fff" opacity=".35" transform="rotate(-25 -22 -40)"/>

     
      <ellipse cx="-31" cy="8" rx="7" ry="4" fill="#F9A8D4" opacity=".6"/>
      <ellipse cx="31" cy="8" rx="7" ry="4" fill="#F9A8D4" opacity=".6"/>
      <path d="M-4,8 Q0,13 4,8" fill="none" stroke="#312E81" stroke-width="2" stroke-linecap="round"/>

      <!-- Ojos felices -->
      <path d="M-25,-6 Q-17,-19 -9,-6" fill="none" stroke="#F0ABFC" stroke-width="7" stroke-linecap="round" filter="url(#blur2)" opacity=".8"/>
      <path d="M-25,-6 Q-17,-19 -9,-6" fill="none" stroke="#312E81" stroke-width="4" stroke-linecap="round"/>
      <path d="M9,-6 Q17,-19 25,-6" fill="none" stroke="#F0ABFC" stroke-width="7" stroke-linecap="round" filter="url(#blur2)" opacity=".8"/>
      <path d="M9,-6 Q17,-19 25,-6" fill="none" stroke="#312E81" stroke-width="4" stroke-linecap="round"/>

   
      <g transform="translate(46,12)">
        <g class="wave">
          <path d="M0,0 Q14,-6 20,-26" fill="none" stroke="#C4B5FD" stroke-width="11" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>


  <rect x="350" y="184" width="200" height="14" rx="7" fill="#11142A" stroke="url(#edge)" stroke-width="1.5"/>
  <rect x="352" y="198" width="196" height="4" rx="2" fill="#05050A" stroke="#818CF8" stroke-opacity=".4"/>
  <circle cx="450" cy="191" r="2.5" fill="#D946EF" class="led"/>

  <!-- Marco -->
  <rect x="1" y="1" width="898" height="238" rx="17" fill="none" stroke="url(#edge)" stroke-opacity=".6" stroke-width="1.5"/>
</svg>
